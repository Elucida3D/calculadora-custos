<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custo | Elucida3D</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #0071e3; --primary-hover: #0077ed; --whatsapp: #25D366; --whatsapp-hover: #20ba5a; --background: #f5f5f7; --surface: #ffffff; --text: #1d1d1f; --text-secondary: #86868b; --border: #d2d2d7; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--background); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--surface); border-radius: 18px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); padding: 30px; width: 100%; max-width: 600px; }
        header { text-align: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        header h1 { font-size: 24px; color: var(--primary); font-weight: 700; }
        header p { font-size: 14px; color: var(--text-secondary); margin-top: 5px; }
        .section-title { font-size: 16px; font-weight: 600; margin: 20px 0 10px 0; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
        input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--background); outline: none; }
        input:focus { border-color: var(--primary); background: var(--surface); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .btn-calc { background: var(--primary); color: white; }
        .btn-calc:hover { background: var(--primary-hover); }
        .btn-wpp { background: var(--whatsapp); color: white; display: none; justify-content: center; align-items: center; gap: 8px; text-decoration: none; text-align: center; }
        .btn-wpp:hover { background: var(--whatsapp-hover); }
        .results { margin-top: 25px; background: var(--background); border-radius: 12px; padding: 20px; }
        .result-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--text-secondary); }
        .result-row.total { border-top: 1px solid var(--border); padding-top: 10px; font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 0; }
        footer { text-align: center; margin-top: 25px; font-size: 12px; color: var(--text-secondary); }
    </style>
</head><body>
<div class="container">
    <header>
        <h1>Elucida3D</h1>
        <p>Calculadora Profissional de Custos de Impressão</p>
    </header>

    <div class="section-title">📦 Material</div>
    <div class="grid">
        <div class="input-group"><label for="peso">Peso usado (g)</label><input type="number" id="peso" placeholder="Ex: 50" min="0" step="any"></div>
        <div class="input-group"><label for="custoFilamento">Preço do Filamento (R$/kg)</label><input type="number" id="custoFilamento" value="120" min="0" step="any"></div>
    </div>

    <div class="section-title">⏱️ Tempo de Impressão</div>
    <div class="grid">
        <div class="input-group"><label for="horas">Horas</label><input type="number" id="horas" value="0" min="0"></div>
        <div class="input-group"><label for="minutos">Minutos</label><input type="number" id="minutos" value="0" min="0" max="59"></div>
    </div>

    <div class="section-title">⚙️ Custos Operacionais & Energia</div>
    <div class="grid">
        <div class="input-group"><label for="potencia">Potência da Impressora (W)</label><input type="number" id="potencia" value="250" min="0"></div>
        <div class="input-group"><label for="energia">Custo da Energia (R$/kWh)</label><input type="number" id="energia" value="0.75" min="0" step="any"></div>
        <div class="input-group"><label for="taxaHora">Depreciação/Hora (R$)</label><input type="number" id="taxaHora" value="2.00" min="0" step="any"></div>
        <div class="input-group"><label for="lucro">Margem de Lucro (%)</label><input type="number" id="lucro" value="50" min="0"></div>
    </div>

    <button class="btn-calc" onclick="calcularCusto()">Calcular Preço</button>

    <div class="results" id="resultadosBox" style="display: none;">
        <div class="result-row"><span>Gasto de Material:</span><span id="resMaterial">R$ 0,00</span></div>
        <div class="result-row"><span>Gasto de Energia:</span><span id="resEnergia">R$ 0,00</span></div>
        <div class="result-row"><span>Uso da Máquina:</span><span id="resTaxa">R$ 0,00</span></div>
        <div class="result-row total"><span>Preço Final:</span><span id="resTotal">R$ 0,00</span></div>
    </div>

    <a href="#" id="wppBtn" class="btn-wpp" target="_blank">💬 Enviar Orçamento no WhatsApp</a>
    <footer>&copy; 2026 Elucida3D. Todos os direitos reservados.</footer>
</div><script>
function calcularCusto() {
    const peso = parseFloat(document.getElementById('peso').value) || 0;
    const custoFilamento = parseFloat(document.getElementById('custoFilamento').value) || 0;
    const horas = parseInt(document.getElementById('horas').value) || 0;
    const minutos = parseInt(document.getElementById('minutos').value) || 0;
    const potencia = parseFloat(document.getElementById('potencia').value) || 0;
    const energiaKwh = parseFloat(document.getElementById('energia').value) || 0;
    const taxaHora = parseFloat(document.getElementById('taxaHora').value) || 0;
    const lucroPorcentagem = parseFloat(document.getElementById('lucro').value) || 0;

    const tempoTotalHoras = horas + (minutos / 60);
    const custoMaterial = (peso / 1000) * custoFilamento;
    const custoEnergia = (potencia / 1000) * tempoTotalHoras * energiaKwh;
    const custoTaxaMaquina = tempoTotalHoras * taxaHora;
    const custoDeProducao = custoMaterial + custoEnergia + custoTaxaMaquina;
    const precoFinal = custoDeProducao * (1 + (lucroPorcentagem / 100));

    document.getElementById('resMaterial').innerText = custoMaterial.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('resEnergia').innerText = custoEnergia.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('resTaxa').innerText = custoTaxaMaquina.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('resTotal').innerText = precoFinal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('resultadosBox').style.display = 'block';

    const fMoeda = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const textoMensagem = encodeURIComponent(
        `Olá! Orçamento da *Elucida3D*:\n\n` +
        `📦 *Impressão:*\n- Peso: ${peso}g\n- Tempo: ${horas}h ${minutos}min\n\n` +
        `💰 *Valores:*\n- Material: ${fMoeda(custoMaterial)}\n- Operação: ${fMoeda(custoEnergia + custoTaxaMaquina)}\n` +
        `-------\n*Preço Final: ${fMoeda(precoFinal)}*`
    );

    const btnWpp = document.getElementById('wppBtn');
    btnWpp.href = `https://wa.me{textoMensagem}`;
    btnWpp.style.display = 'flex';
}
</script>
</body>
</html>
