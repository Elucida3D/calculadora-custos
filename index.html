<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Impressão 3D - Elucida 3D</title>
    <!-- Biblioteca para gerar PDF -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }
        .brand-header h2 { margin: 0; color: #007bff; font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
        .brand-header p { margin: 5px 0 0 0; color: #666; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #444; font-weight: 600; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-calc { background-color: #007bff; color: white; }
        .btn-calc:hover { background-color: #0056b3; }
        .btn-pdf { background-color: #28a745; color: white; display: none; }
        .btn-pdf:hover { background-color: #218838; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .total { font-weight: bold; font-size: 18px; color: #17a2b8; border-top: 1px solid #ccc; padding-top: 8px; }
        #pdf-template { padding: 30px; background: white; color: #333; font-family: sans-serif; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h2>Elucida 3D</h2>
        <p>📱 (88) 98125-6089</p>
    </div>
    
    <div class="form-group">
        <label>Nome do Cliente:</label>
        <input type="text" id="cliente" placeholder="Ex: João Silva">
    </div>
    <div class="form-group">
        <label>Nome da Peça / Projeto:</label>
        <input type="text" id="peca" placeholder="Ex: Mini Nossa Senhora">
    </div>
    <div class="form-group">
        <label>Peso da Peça (gramas):</label>
        <input type="number" id="peso" placeholder="0">
    </div>
    <div class="form-group">
        <label>Tempo de Impressão (horas):</label>
        <input type="number" id="tempo" placeholder="0">
    </div>
    <div class="form-group">
        <label>Margem de Lucro (%):</label>
        <input type="number" id="lucro" value="100">
    </div>
    <div class="form-group">
        <label>Prazo de Entrega:</label>
        <input type="text" id="prazo" placeholder="Ex: 3 dias úteis, Pronta entrega">
    </div>

    <button class="btn-calc" onclick="calcular()">Calcular Valor</button>
    <button class="btn-pdf" id="btnPdf" onclick="gerarPDF()">Gerar PDF do Orçamento</button>

    <div class="result-box" id="resultado">
        <div class="result-item"><span>Custo de Material:</span> <span id="resMaterial">R\$ 0,00</span></div>
        <div class="result-item"><span>Custo de Máquina:</span> <span id="resMaquina">R\$ 0,00</span></div>
        <div class="result-item total"><span>Preço Sugerido:</span> <span id="resTotal">R\$ 0,00</span></div>
    </div>
</div>

<script>
    // Configurações fixas da Elucida 3D
    const NOME_MARCA = "Elucida 3D";
    const WHATSAPP   = "(88) 98125-6089";
    const PRECO_KG   = 130;
    const PRECO_HORA = 2;

    function calcular() {
        const peso = parseFloat(document.getElementById('peso').value) || 0;
        const tempo = parseFloat(document.getElementById('tempo').value) || 0;
        const lucro = parseFloat(document.getElementById('lucro').value) || 0;

        const custoMaterial = (peso * (PRECO_KG / 1000));
        const custoMaquina = tempo * PRECO_HORA;
        const custoFabricacao = custoMaterial + custoMaquina;
        const precoFinal = custoFabricacao * (1 + (lucro / 100));

        document.getElementById('resMaterial').innerText = `R$ ${custoMaterial.toFixed(2).replace('.', ',')}`;
        document.getElementById('resMaquina').innerText = `R$ ${custoMaquina.toFixed(2).replace('.', ',')}`;
        document.getElementById('resTotal').innerText = `R$ ${precoFinal.toFixed(2).replace('.', ',')}`;

        document.getElementById('resultado').style.display = 'block';
        document.getElementById('btnPdf').style.display = 'block';
    }

    function gerarPDF() {
        const cliente = document.getElementById('cliente').value || 'Cliente';
        const peca = document.getElementById('peca').value || 'Peça 3D';
        const prazo = document.getElementById('prazo').value || 'A combinar';
        const total = document.getElementById('resTotal').innerText;

        const elemento = document.createElement('div');
        elemento.innerHTML = `
            <div id="pdf-template">
                <div style="text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px;">
                    <h1 style="margin: 0; color: #007bff; font-size: 28px; font-weight: bold; letter-spacing: 0.5px;">${NOME_MARCA}</h1>
                    <p style="margin: 5px 0 0 0; color: #555; font-size: 14px;">WhatsApp: ${WHATSAPP}</p>
                </div>
                
                <h2 style="color: #333; font-size: 18px; margin-bottom: 15px;">Orçamento de Serviço de Impressão 3D</h2>
                
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px;">
                    <tr>
                        <td style="padding: 6px 0; color: #666; width: 130px;"><strong>Cliente:</strong></td>
                        <td style="padding: 6px 0; color: #111;">${cliente}</td>
                    </tr>
                    <tr>
                        <td style="padding: 6px 0; color: #666;"><strong>Item/Modelo:</strong></td>
                        <td style="padding: 6px 0; color: #111;">${peca}</td>
                    </tr>
                    <tr>
                        <td style="padding: 6px 0; color: #666;"><strong>Prazo de Entrega:</strong></td>
                        <td style="padding: 6px 0; color: #111; font-weight: bold; color: #007bff;">${prazo}</td>
                    </tr>
                    <tr>
                        <td style="padding: 6px 0; color: #666;"><strong>Data de Emissão:</strong></td>
                        <td style="padding: 6px 0; color: #111;">${new Date().toLocaleDateString('pt-BR')}</td>
                    </tr>
                </table>
                
                <div style="background: #f8f9fa; border-left: 4px solid #28a745; padding: 15px; margin: 30px 0; border-radius: 4px;">
                    <span style="font-size: 13px; color: #666; display: block; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Valor Total do Serviço</span>
                    <strong style="font-size: 26px; color: #28a745; display: block; margin-top: 5px;">${total}</strong>
                </div>
                
                <div style="margin-top: 45px; border-top: 1px solid #eee; padding-top: 15px; text-align: center;">
                    <p style="font-size: 12px; color: #888; margin: 0;">Agradecemos a preferência e a confiança em nosso trabalho!</p>
                </div>
            </div>
        `;

        const opcoes = {
            margin: 15,
            filename: `Orcamento_${cliente.replace(/\s+/g, '_')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opcoes).from(elemento).save();
    }
</script>

</body>
</html>A
